[project]
name = "nexa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.3",
    "django-ratelimit>=4.1.0",
    "pillow>=12.1.1",
    "psycopg[binary]>=3.3.3",
    "python-dotenv>=1.2.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "NexaSite.settings_test"
pythonpath = ["NexaSite"]
testpaths = ["NexaSite"]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
norecursedirs = ["*.egg", ".*", "_darcs", "build", "dist", "migrations", "node_modules"]

